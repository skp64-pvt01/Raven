# Raven tutorials for Rust - one crate per step, built together.

[workspace]
resolver = "2"

members = [
    "01-first-window",
    "02-layout",
    "03-controls",
    "04-actions",
    "05-xml-files",
    "06-menus",
    "07-text-editor",
    "08-capstone-notes",
]

# Every step points at the binding in the Raven checkout. Change this if your
# Raven lives somewhere else (see README.md).
[workspace.dependencies]
raven-gui = { path = "../../bindings/rust" }
