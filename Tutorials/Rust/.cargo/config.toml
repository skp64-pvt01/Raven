# How this course finds Raven.
#
# Build this repository's shared library once, from Raven's root:
#
#     cmake -S . -B build -DRAVEN_BUILD_SHARED=ON
#     cmake --build build
#
# Then `cargo test` and `cargo run` need no environment variables at all:
#
#   - RAVEN_LIB_DIR tells the build script (bindings/rust/build.rs) where the
#     library is to link against;
#   - the rpath records the same place in the binary, so the loader finds
#     libraven.so.0 at run time. ($ORIGIN is the folder of the binary:
#     target/debug -> four levels up -> the repository root, then build/.)
#
# Cargo overwrites LD_LIBRARY_PATH for the programs it starts, which is why the
# rpath, and not an environment variable, is what makes `cargo test` work.
#
# Using the installed raven-dev package instead (a static libraven.a)?
#
#     RAVEN_STATIC=1 RAVEN_LIB_DIR=/usr/lib cargo test --workspace
#
[env]
RAVEN_LIB_DIR = { value = "../../build", relative = true }

[build]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../../build"]
